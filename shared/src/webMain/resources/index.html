<!doctype html>
<html lang="fa" dir="rtl" translate="no">
<head>
    <meta charset="utf-8">
    <!-- resizes-content: Chrome shrinks the page above the keyboard instead of sliding it under. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
    <title>ملووا</title>
    <!-- On a phone in another language, Chrome's translate bar would cover the bottom navigation. -->
    <meta name="google" content="notranslate">
    <!-- Home-screen app: opens full screen, without the browser's address bar. -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#1B1230">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="ملووا">
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #1B1230; }
        #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
                   flex-direction: column;
                   padding: 24px; box-sizing: border-box; text-align: center; line-height: 1.9;
                   color: #ddd; font-family: sans-serif;
                   /* Covers the app until main.kt removes it, once the fonts are in. */
                   z-index: 10; background: #1B1230; }
        #loading svg { width: 96px; height: 96px; overflow: visible; }
        #loading .line { stroke-dasharray: 1; animation: draw 1.8s ease-in-out infinite alternate; }
        #loading .dot { transform-box: fill-box; transform-origin: center; animation: pulse 0.9s ease-in-out infinite alternate; }
        @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
        @keyframes pulse { from { transform: scale(0.75); } to { transform: scale(1.1); } }
    </style>
    <script>
        // melova.js picks the wasm build, or the JS build on browsers without WasmGC
        // (iOS before 18.2). If loading fails, say so instead of leaving the loading mark up.
        (function () {
            function show(text) {
                var box = document.getElementById('loading');
                if (box) box.innerHTML = text;
            }
            function failed(detail) {
                show('بارگذاری ملووا ناموفق بود.<br><small dir="ltr">' + String(detail || '') + '</small>');
            }
            window.addEventListener('error', function (event) { failed(event.message); });
            window.addEventListener('unhandledrejection', function (event) { failed(event.reason); });
        })();
    </script>
    <script>
        // From iOS 27, Safari keeps only the last focus() before the next frame, and one made
        // outside a tap stops the keyboard from opening. Compose 1.9.3 calls focus() again after
        // every tap and text change, so on a field that already has focus, only the first call
        // during a tap goes through. That call has to stay: it is what opens the keyboard on a
        // field focused by code, such as the login code. Compose 1.12.2 has its own guard.
        (function () {
            var focus = HTMLElement.prototype.focus;
            var tapping = false;
            window.addEventListener('touchend', function () { tapping = true; }, true);
            window.addEventListener('touchend', function () { tapping = false; });
            HTMLElement.prototype.focus = function (options) {
                if (this.getRootNode().activeElement === this && !tapping) return;
                tapping = false;
                focus.call(this, options);
            };
        })();
    </script>
    <script>
        // The app draws on one canvas that can take focus, so any tap on it — a send button, the
        // microphone — took focus from the hidden box Compose types into. The keyboard went down,
        // the page jumped under the finger, and the tap missed. While that box has focus, a tap
        // leaves it there; Compose still hears the tap, and still moves focus itself when it means to.
        (function () {
            window.addEventListener('mousedown', function (event) {
                var root = document.body && document.body.shadowRoot;
                var active = (root && root.activeElement) || document.activeElement;
                if (active && (active.tagName === 'TEXTAREA' || active.tagName === 'INPUT')) event.preventDefault();
            }, true);
        })();
    </script>
    <script>
        // Compose gets no keyboard inset in the browser, and Safari (and Chrome without the meta
        // above) only overlays the keyboard and lets the page be dragged under it, taking the
        // message field along. So the app is held to the part of the screen the keyboard leaves —
        // its bottom edge on the keyboard's top — and the page itself never moves.
        (function () {
            var view = window.visualViewport;
            if (!view) return;
            var fitted = '';
            function fit() {
                var body = document.body;
                if (!body) return;
                var top = view.offsetTop + 'px', height = view.height + 'px';
                if (top + height === fitted) return;
                fitted = top + height;
                body.style.position = 'fixed';
                body.style.left = '0';
                body.style.width = '100%';
                body.style.top = top;
                body.style.height = height;
                // Compose measures its box again only when the window says it changed size.
                window.dispatchEvent(new Event('resize'));
            }
            // The keyboard changes height after it is up too — the emoji panel is taller on some
            // phones — and some browsers report a keyboard sliding in only once it has stopped.
            // So any sign of a change is followed frame by frame for the next 40 frames or so.
            var following = 0;
            function follow() {
                fit();
                if (following > 0) return;
                following = 40;
                (function step() {
                    fit();
                    if (--following > 0) requestAnimationFrame(step);
                })();
            }
            view.addEventListener('resize', follow);
            view.addEventListener('scroll', follow);
            window.addEventListener('resize', follow);
            document.addEventListener('focusin', follow);
            document.addEventListener('focusout', follow);
            document.addEventListener('DOMContentLoaded', fit);
            // Compose reads every touch itself; the browser's own dragging is what moved the page.
            document.addEventListener('touchmove', function (event) { event.preventDefault(); }, { passive: false });
        })();
    </script>
    <script src="melova-audio.js"></script>
    <script type="application/javascript" src="melova.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
        }
    </script>
</head>
<body>
<div id="loading" role="img" aria-label="ملووا">
    <!-- The launcher icon's mark, drawn inline so it shows before anything else has loaded. -->
    <svg viewBox="0 0 108 108">
        <g transform="translate(22 21) scale(0.32)">
            <path class="line" pathLength="1" d="M28,150 C38,92 48,52 64,52 S88,120 100,120 S120,52 136,52 S160,98 166,150"
                  fill="none" stroke="#9B7BFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
            <path class="dot" d="M150,150 a16,16 0 1,0 32,0 a16,16 0 1,0 -32,0" fill="#F3C969"/>
        </g>
    </svg>
</div>
</body>
</html>
